<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gün Gün">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Gün Gün</title>
<style>
:root{
  --bg:#F6F1E9;--card:#FFFDF9;--ink:#2B2A27;--muted:#8A847A;--line:#E8E1D5;
  --acc:#3F6B55;--acc-soft:#DCE8DF;--on-acc:#fff;
  --water:#3B7EA1;--warn:#B5623C;--warn-soft:#F5E1D6;--gold:#A87A2C;--gold-soft:#F3E8D2;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161614;--card:#211F1C;--ink:#EEEAE2;--muted:#9A9488;--line:#34312C;
  --acc:#7DB394;--acc-soft:#253B2F;--on-acc:#10201A;
  --water:#78B4D4;--warn:#E09372;--warn-soft:#3D2A21;--gold:#D9AF62;--gold-soft:#3A3020;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;cursor:pointer}
main{max-width:520px;margin:0 auto;padding:8px 16px 24px}
h2{font-size:26px;letter-spacing:-.02em;margin:14px 2px 14px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
small{color:var(--muted);font-size:13px}

.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px 14px}
.hello{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.datenav{display:flex;align-items:center;gap:6px;color:var(--muted);margin-top:6px;font-size:15px}
.datenav button{width:30px;height:30px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:18px;line-height:1}
.datenav button:disabled{opacity:.3}
.ring{width:70px;height:70px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--acc) calc(var(--p)*360deg),var(--line) 0)}
.ring span{width:56px;height:56px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}
.linkbtn{border:0;background:none;color:var(--acc);font-weight:600;padding:0 2px 12px}

.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:10px}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.ct{flex:1;min-width:0}.ct b{display:block}
.mini{border:0;background:var(--acc-soft);color:var(--acc);padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:8px 13px;border-radius:999px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}

.step{display:flex;align-items:center;background:var(--bg);border-radius:999px;padding:3px;flex:none}
.step button{width:38px;height:38px;border:0;border-radius:50%;background:var(--card);color:var(--ink);font-size:20px;line-height:1}
.step span{min-width:66px;text-align:center;font-size:14px;font-weight:600}
.step.bad span{color:var(--warn)}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:12px}
.glass{aspect-ratio:3/4;border:1.5px solid var(--water);border-radius:4px 4px 10px 10px;background:transparent;padding:0;opacity:.6}
.glass.on{background:var(--water);opacity:1}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}.row:last-child{padding-bottom:2px}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;position:relative;padding:0}
.row.on .check{background:var(--acc);border-color:var(--acc)}
.row.on .check::after{content:'';position:absolute;left:9px;top:4px;width:7px;height:13px;border:solid var(--on-acc);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.rt{flex:1;min-width:0;cursor:pointer}.rt b{display:block;font-weight:600}
.amt{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;flex:none}
.amt input[type=number]{width:60px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;text-align:right}

.smokebtns{display:flex;gap:8px;margin-top:12px;align-items:center}
.pill{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:11px 8px;border-radius:999px;font-weight:600;font-size:15px}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.note{margin-top:10px;font-size:13px;color:var(--muted)}
.note b{color:var(--ink)}

.hint{background:var(--gold-soft);color:var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.hint button{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.tile .big{font-size:28px;font-weight:750;letter-spacing:-.02em;margin:2px 0}
.tile.green .big{color:var(--acc)}.tile.gold .big{color:var(--gold)}

.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-size:16px}
.calhead button{width:32px;height:32px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:18px}
.calhead button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font-size:13px;position:relative;overflow:hidden;padding:0}
.cal button::before{content:'';position:absolute;inset:0;background:var(--acc);opacity:calc(var(--p) * .9)}
.cal button span{position:relative}
.cal button.hi span{color:var(--on-acc);font-weight:700}
.cal button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal button:disabled{opacity:.3}

.stat{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.stat:first-child{border-top:0;padding-top:2px}.stat:last-child{padding-bottom:2px}
.stat .ic{width:36px;height:36px;font-size:18px}
.stat .grow{flex:1;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.bar.gold i{background:var(--gold)}
.streak{font-size:13px;font-weight:600;color:var(--warn);white-space:nowrap}

.savehero{text-align:center;padding:22px 14px}
.savehero .big{font-size:40px;font-weight:750;letter-spacing:-.03em;color:var(--gold)}
.savehero .bar{height:10px;border-radius:5px;margin:14px 0 8px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .grow{flex:1;min-width:0}
.entry b{font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);font-size:20px;padding:4px 6px}

.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 2px 5px}
input[type=text],input[type=number],input[type=date],textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:46px}
textarea{resize:vertical;min-height:150px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--acc);color:var(--on-acc);font-weight:700;font-size:16px}
.btn.auto{width:auto;padding:12px 18px}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:600}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btns{display:grid;gap:8px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 4px}

nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav#tabs .in{display:flex;width:100%;max-width:520px}
nav#tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}
nav#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#tabs button.on{color:var(--acc)}

#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
#sheet.open{display:flex}
.sheetbox{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheetbox h2{margin:0 0 4px}
.sheetbox p{color:var(--muted);margin:0 0 18px;font-size:15px}
.sheetbox input{background:var(--bg)}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="view"></main>

<nav id="tabs"><div class="in">
  <button data-act="tab" data-t="bugun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Bugün</button>
  <button data-act="tab" data-t="ilerleme"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>İlerleme</button>
  <button data-act="tab" data-t="birikim"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Birikim</button>
  <button data-act="tab" data-t="ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ayarlar</button>
</div></nav>

<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY = 'gungun_v1';
const DEF_SUPPS = ['Omega-3', 'B vitamini', 'C vitamini', 'Kolajen', 'Glukozamin', 'Magnezyum'];
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUNLER = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

// Günlük rutinler; ilerleme halkası ve takvim bunların kaçının tamamlandığına bakar.
const ROUTINES = [
  { k: 'supp',   t: 'Takviyeler',   ic: '💊' },
  { k: 'water',  t: 'Su',           ic: '💧' },
  { k: 'sport',  t: 'Spor',         ic: '🏃', unit: 'sportMin', u: 'dk',    hint: 'Hareket et, kısa da olsa olur' },
  { k: 'book',   t: 'Kitap okuma',  ic: '📖', unit: 'bookPages', u: 'sayfa', hint: 'Birkaç sayfa bile sayılır' },
  { k: 'vaka',   t: 'Vaka okuma',   ic: '🗂️', unit: 'vakaCount', u: 'vaka',  hint: 'Bugünün vakası' },
  { k: 'metime', t: 'Me time',      ic: '🕯️', unit: 'metimeMin', u: 'dk',    hint: 'Bakım saati, sadece sana ait' },
  { k: 'smoke',  t: 'Dumansız gün', ic: '🚭' },
];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const dk = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pk = k => { const [a, b, c] = k.split('-').map(Number); return new Date(a, b - 1, c); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dayDiff = (a, b) => Math.round((b - a) / 864e5);
const tl = n => '₺' + Math.round(n).toLocaleString('tr-TR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };

function fresh() {
  return {
    settings: { name: '', supps: DEF_SUPPS.slice(), waterGoal: 8, saveGoal: 0,
      quitDate: null, cigsPerDay: 0, packPrice: 0, packSize: 20, onboarded: false, hintClosed: false },
    days: {}, savings: [],
  };
}
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && r.settings && r.days) { const f = fresh(); r.settings = Object.assign(f.settings, r.settings); r.savings = r.savings || []; return r; }
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Kaydedilemedi'); } }

let S = load();
let cur = today();
let lastToday = dk(cur);
let tab = 'bugun';
let calMonth = new Date(cur.getFullYear(), cur.getMonth(), 1);

const rec = k => S.days[k] || {};
function isDone(r, d) {
  const s = S.settings;
  switch (r) {
    case 'supp': return s.supps.length > 0 && s.supps.every(x => d.supp && d.supp[x]);
    case 'water': return (d.water || 0) >= s.waterGoal;
    case 'smoke': return d.smoke === 0;
    default: return !!d[r];
  }
}
const doneCount = d => ROUTINES.filter(r => isDone(r.k, d)).length;
function streak(r) {
  let d = today(), n = 0;
  if (!isDone(r, rec(dk(d)))) d = addDays(d, -1);
  while (isDone(r, rec(dk(d)))) { n++; d = addDays(d, -1); }
  return n;
}
function firstDay() { const ks = Object.keys(S.days).sort(); return ks.length ? pk(ks[0]) : today(); }

// Sigara: bırakılan günden bu yana içilmeyen adet ve cepte kalan para.
function smokeStats() {
  const s = S.settings;
  if (!s.quitDate) return null;
  const q = pk(s.quitDate), days = Math.max(0, dayDiff(q, today()));
  let smoked = 0;
  for (const [k, d] of Object.entries(S.days)) if (k >= s.quitDate && d.smoke > 0) smoked += d.smoke;
  const avoided = Math.max(0, days * (s.cigsPerDay || 0) - smoked);
  const money = s.packPrice > 0 ? avoided / (s.packSize || 20) * s.packPrice : 0;
  return { days, avoided, money };
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800);
}
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

/* ---------- Bugün ---------- */
function vToday() {
  const s = S.settings, k = dk(cur), d = rec(k), isToday = k === dk(today());
  const n = doneCount(d), h = new Date().getHours();
  const greet = !isToday ? 'Geçmiş gün' : h < 6 ? 'İyi geceler' : h < 12 ? 'Günaydın' : h < 18 ? 'İyi günler' : 'İyi akşamlar';
  const dateLbl = (isToday ? 'Bugün · ' : '') + cur.getDate() + ' ' + AYLAR[cur.getMonth()] + ' ' + GUNLER[cur.getDay()];

  let html = `<section class="hero">
    <div><div class="hello">${greet}${isToday && s.name ? ', ' + esc(s.name) : ''}</div>
      <div class="datenav"><button data-act="prev" aria-label="Önceki gün">‹</button><span>${dateLbl}</span>
      <button data-act="next" aria-label="Sonraki gün" ${isToday ? 'disabled' : ''}>›</button></div></div>
    <div class="ring" style="--p:${n / ROUTINES.length}"><span>${n}/${ROUTINES.length}</span></div>
  </section>`;
  if (!isToday) html += `<button class="linkbtn" data-act="gotoday">← Bugüne dön</button>`;

  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!standalone && !s.hintClosed && isToday) {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    html += `<div class="hint"><div style="flex:1">📲 <b>Ana ekrana ekle</b>, gerçek bir uygulama gibi açılsın ve verilerin güvende kalsın.<br><small>${ios ? 'Safari\'de alttaki Paylaş düğmesine dokun, sonra “Ana Ekrana Ekle”yi seç.' : 'Chrome\'da sağ üstteki ⋮ menüsünden “Ana ekrana ekle”yi seç.'}</small></div><button data-act="hintClose" aria-label="Kapat">×</button></div>`;
  }

  // Takviyeler
  const taken = s.supps.filter(x => d.supp && d.supp[x]).length, all = s.supps.length > 0 && taken === s.supps.length;
  html += `<div class="card"><div class="ch"><span class="ic">💊</span><div class="ct"><b>Takviyeler</b><small>${s.supps.length ? taken + '/' + s.supps.length + ' alındı' : 'Ayarlar\'dan takviye ekle'}</small></div>
    ${s.supps.length ? `<button class="mini" data-act="suppAll">${all ? 'Temizle' : 'Hepsini aldım'}</button>` : ''}</div>
    <div class="chips">${s.supps.map((x, i) => `<button class="chip ${d.supp && d.supp[x] ? 'on' : ''}" data-act="supp" data-i="${i}">${esc(x)}</button>`).join('')}</div></div>`;

  // Su
  const w = d.water || 0, g = s.waterGoal;
  html += `<div class="card"><div class="ch"><span class="ic">💧</span><div class="ct"><b>Su</b><small>${w}/${g} bardak · ${(w * 0.25).toLocaleString('tr-TR')} litre</small></div>
    <div class="step"><button data-act="w-" aria-label="Bir bardak çıkar">−</button><button data-act="w+" aria-label="Bir bardak ekle">+</button></div></div>
    <div class="glasses">${Array.from({ length: Math.max(g, w) }, (_, i) => `<button class="glass ${i < w ? 'on' : ''}" data-act="wset" data-i="${i}" aria-label="${i + 1}. bardak"></button>`).join('')}</div></div>`;

  // Günlük işler
  html += `<div class="card">` + ROUTINES.filter(r => r.unit).map(r => {
    const on = !!d[r.k];
    return `<div class="row ${on ? 'on' : ''}"><button class="check" data-act="tog" data-k="${r.k}" aria-label="${r.t}" aria-pressed="${on}"></button>
      <div class="rt" data-act="tog" data-k="${r.k}"><b>${r.ic} ${r.t}</b>${on ? '' : `<small>${r.hint}</small>`}</div>
      ${on ? `<label class="amt"><input type="number" inputmode="numeric" min="0" data-amt="${r.unit}" value="${d[r.unit] ?? ''}" placeholder="–">${r.u}</label>` : ''}</div>`;
  }).join('') + `</div>`;

  // Sigara
  const st = smokeStats(), sf = streak('smoke');
  let sub = sf > 0 ? `${sf} gündür dumansız` : 'Her dumansız gün bir zafer';
  html += `<div class="card"><div class="ch"><span class="ic">🚭</span><div class="ct"><b>Sigara</b><small>${sub}</small></div></div>
    <div class="smokebtns"><button class="pill ${d.smoke === 0 ? 'on' : ''}" data-act="smoke0">${d.smoke === 0 ? '✓ İçmedim' : (isToday ? 'Bugün içmedim' : 'Bu gün içmedim')}</button>
    <div class="step ${d.smoke > 0 ? 'bad' : ''}"><button data-act="s-" aria-label="Azalt">−</button><span>${d.smoke > 0 ? d.smoke + ' adet' : 'İçtim'}</span><button data-act="s+" aria-label="Artır">+</button></div></div>
    ${st ? `<div class="note">Bırakalı <b>${st.days} gün</b> oldu${st.money > 0 ? ` · cebinde <b>${tl(st.money)}</b> kaldı` : ''}</div>` : `<div class="note">Bırakma tarihini Ayarlar'a girersen günleri ve biriken parayı sayarım.</div>`}
    </div>`;

  return html;
}

/* ---------- İlerleme ---------- */
function vProgress() {
  const st = smokeStats(), sf = streak('smoke');
  let html = `<h2>İlerleme</h2><div class="tiles">
    <div class="tile green"><small>Dumansız seri</small><div class="big">${sf} gün</div><small>${st ? 'Bırakalı ' + st.days + ' gün' : 'Bırakma tarihi girilmedi'}</small></div>
    <div class="tile gold"><small>Sigaradan kalan</small><div class="big">${st && st.money > 0 ? tl(st.money) : '–'}</div><small>${st && st.avoided ? Math.round(st.avoided).toLocaleString('tr-TR') + ' sigara içilmedi' : 'Ayarlar\'dan fiyat gir'}</small></div>
  </div>`;

  // Ay takvimi
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), t = today();
  const first = new Date(y, m, 1), len = new Date(y, m + 1, 0).getDate(), off = (first.getDay() + 6) % 7;
  const isCurMonth = y === t.getFullYear() && m === t.getMonth();
  let cells = ['Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct', 'Pz'].map(x => `<div class="h">${x}</div>`).join('');
  for (let i = 0; i < off; i++) cells += '<div></div>';
  for (let i = 1; i <= len; i++) {
    const d = new Date(y, m, i), k = dk(d), p = doneCount(rec(k)) / ROUTINES.length, future = d > t;
    cells += `<button style="--p:${future ? 0 : p}" class="${p >= .6 ? 'hi' : ''} ${k === dk(t) ? 'today' : ''}" ${future ? 'disabled' : `data-act="openDay" data-d="${k}"`}><span>${i}</span></button>`;
  }
  html += `<div class="card"><div class="calhead"><button data-act="calPrev" aria-label="Önceki ay">‹</button><b>${AYLAR[m]} ${y}</b><button data-act="calNext" aria-label="Sonraki ay" ${isCurMonth ? 'disabled' : ''}>›</button></div>
    <div class="cal">${cells}</div><div class="note" style="text-align:center">Renk ne kadar doluysa o gün o kadar çok rutin tamamlanmış. Bir güne dokunup düzenleyebilirsin.</div></div>`;

  // Rutin bazında son 30 gün
  const span = Math.min(30, dayDiff(firstDay(), t) + 1);
  html += `<h3>Son ${span} gün</h3><div class="card">` + ROUTINES.map(r => {
    let c = 0; for (let i = 0; i < span; i++) if (isDone(r.k, rec(dk(addDays(t, -i))))) c++;
    const s = streak(r.k), pc = Math.round(c / span * 100);
    return `<div class="stat"><span class="ic">${r.ic}</span><div class="grow"><b>${r.t}</b> <small>${c}/${span} gün</small><div class="bar"><i style="width:${pc}%"></i></div></div>${s > 1 ? `<span class="streak">🔥 ${s}</span>` : ''}</div>`;
  }).join('') + `</div>`;
  return html;
}

/* ---------- Birikim ---------- */
function vSave() {
  const s = S.settings, t = today(), mk = dk(t).slice(0, 7);
  const list = S.savings.filter(e => e.date.startsWith(mk)).sort((a, b) => b.id - a.id);
  const total = list.reduce((a, e) => a + e.amount, 0), all = S.savings.reduce((a, e) => a + e.amount, 0);
  const pc = s.saveGoal > 0 ? Math.min(100, Math.max(0, total / s.saveGoal * 100)) : 0;
  let html = `<h2>Birikim</h2><div class="card savehero"><small>${AYLAR[t.getMonth()]} ayında biriktirdiğin</small><div class="big">${tl(total)}</div>
    ${s.saveGoal > 0
      ? `<div class="bar gold"><i style="width:${pc}%"></i></div><small>${total >= s.saveGoal ? 'Bu ayın hedefi tamam 🎉' : 'Hedef ' + tl(s.saveGoal) + ' · kalan ' + tl(s.saveGoal - total)}</small>`
      : `<div style="margin-top:12px"><button class="btn soft auto" data-act="tab" data-t="ayarlar">Aylık hedef koy</button></div>`}
  </div>
  <div class="card"><div class="addrow"><input type="text" id="saveAmt" inputmode="decimal" placeholder="Tutar (₺)"><input type="text" id="saveNote" placeholder="Not (isteğe bağlı)"></div>
    <div style="margin-top:8px"><button class="btn" data-act="saveAdd">Kumbaraya ekle</button></div></div>`;
  if (list.length) html += `<h3>Bu ay</h3><div class="card">` + list.map(e => `<div class="entry"><div class="grow"><b>${tl(e.amount)}</b> <small>${pk(e.date).getDate()} ${AYLAR[pk(e.date).getMonth()]}${e.note ? ' · ' + esc(e.note) : ''}</small></div><button class="x" data-act="saveDel" data-id="${e.id}" aria-label="Sil">×</button></div>`).join('') + `</div>`;

  // Önceki aylar
  const months = {};
  S.savings.forEach(e => { const m = e.date.slice(0, 7); if (m !== mk) months[m] = (months[m] || 0) + e.amount; });
  const keys = Object.keys(months).sort().reverse().slice(0, 12);
  if (keys.length) html += `<h3>Önceki aylar</h3><div class="card">` + keys.map(m => { const [yy, mm] = m.split('-').map(Number); const hit = s.saveGoal > 0 && months[m] >= s.saveGoal; return `<div class="entry"><div class="grow">${AYLAR[mm - 1]} ${yy}</div><b>${tl(months[m])}</b>${hit ? ' ✓' : ''}</div>`; }).join('') + `</div>`;
  if (all) html += `<div class="foot">Toplam biriktirdiğin: <b>${tl(all)}</b></div>`;
  return html;
}

/* ---------- Ayarlar ---------- */
function vSettings() {
  const s = S.settings;
  return `<h2>Ayarlar</h2>
  <div class="card">
    <label class="field"><span>Adın</span><input type="text" data-set="name" value="${esc(s.name)}" placeholder="Seni nasıl selamlayayım?"></label>
    <label class="field"><span>Takviyeler (her satıra bir tane)</span><textarea data-set="supps">${esc(s.supps.join('\n'))}</textarea></label>
    <label class="field" style="margin:0"><span>Günlük su hedefi (bardak, 1 bardak = 250 ml)</span><input type="number" inputmode="numeric" data-set="waterGoal" value="${s.waterGoal}"></label>
  </div>
  <h3>Sigarayı bırakma</h3><div class="card">
    <label class="field"><span>Bıraktığın gün</span><input type="date" data-set="quitDate" value="${s.quitDate || ''}" max="${dk(today())}"></label>
    <div class="two"><label class="field"><span>Eskiden günde kaç adet</span><input type="number" inputmode="numeric" data-set="cigsPerDay" value="${s.cigsPerDay || ''}" placeholder="örn. 15"></label>
    <label class="field"><span>Paket fiyatı (₺)</span><input type="number" inputmode="decimal" data-set="packPrice" value="${s.packPrice || ''}" placeholder="örn. 100"></label></div>
    <label class="field" style="margin:0"><span>Pakette kaç adet</span><input type="number" inputmode="numeric" data-set="packSize" value="${s.packSize}"></label>
  </div>
  <h3>Birikim</h3><div class="card">
    <label class="field" style="margin:0"><span>Aylık birikim hedefi (₺)</span><input type="number" inputmode="decimal" data-set="saveGoal" value="${s.saveGoal || ''}" placeholder="örn. 5000"></label>
  </div>
  <h3>Yedek</h3><div class="card"><div class="btns">
    <button class="btn soft" data-act="export">Yedeği kaydet</button>
    <button class="btn soft" data-act="import">Yedekten geri yükle</button>
    <button class="btn danger" data-act="reset">Her şeyi sıfırla</button></div>
    <div class="note">Tüm veriler yalnızca bu telefonda saklanır, hiçbir yere gönderilmez. Telefon değiştirirken yedeği kaydet, yeni telefonda geri yükle.</div>
  </div>
  <div class="foot">Gün Gün · sevgiyle yapıldı 🌿</div>`;
}

/* ---------- İlk açılış ---------- */
function openOnboarding() {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="sheetbox"><h2>Hoş geldin 🌿</h2><p>Günlük rutinlerin için küçük bir defter. Birkaç bilgiyle başlayalım, hepsini sonra değiştirebilirsin.</p>
    <label class="field"><span>Adın</span><input type="text" id="obName" placeholder="Seni nasıl selamlayayım?"></label>
    <label class="field"><span>Sigarayı bıraktığın ya da bırakacağın gün</span><input type="date" id="obQuit" value="${dk(today())}"></label>
    <div class="two"><label class="field"><span>Eskiden günde kaç adet</span><input type="number" inputmode="numeric" id="obCigs" placeholder="örn. 15"></label>
    <label class="field"><span>Paket fiyatı (₺)</span><input type="number" inputmode="decimal" id="obPrice" placeholder="örn. 100"></label></div>
    <label class="field"><span>Aylık birikim hedefi (₺)</span><input type="number" inputmode="decimal" id="obSave" placeholder="örn. 5000"></label>
    <div class="btns"><button class="btn" data-act="obDone">Başlayalım</button><button class="btn ghost" data-act="obSkip">Şimdilik geç</button></div></div>`;
  sh.classList.add('open');
}
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet').innerHTML = ''; }

/* ---------- Etkileşim ---------- */
function act(a, el) {
  const s = S.settings, k = dk(cur);
  const d = S.days[k] || (S.days[k] = {});
  const before = doneCount(d);
  switch (a) {
    case 'prev': cur = addDays(cur, -1); break;
    case 'next': if (k < dk(today())) cur = addDays(cur, 1); break;
    case 'gotoday': cur = today(); break;
    case 'supp': { const n = s.supps[+el.dataset.i]; d.supp = d.supp || {}; if (d.supp[n]) delete d.supp[n]; else d.supp[n] = true; buzz(); break; }
    case 'suppAll': { const all = s.supps.every(x => d.supp && d.supp[x]); d.supp = {}; if (!all) s.supps.forEach(x => d.supp[x] = true); buzz(); break; }
    case 'w+': d.water = (d.water || 0) + 1; buzz(); break;
    case 'w-': d.water = Math.max(0, (d.water || 0) - 1); break;
    case 'wset': { const i = +el.dataset.i + 1; d.water = d.water === i ? i - 1 : i; buzz(); break; }
    case 'tog': { const r = el.dataset.k; if (d[r]) delete d[r]; else d[r] = true; buzz(); break; }
    case 'smoke0': if (d.smoke === 0) delete d.smoke; else d.smoke = 0; buzz(); break;
    case 's+': d.smoke = (d.smoke > 0 ? d.smoke : 0) + 1; break;
    case 's-': if (d.smoke > 1) d.smoke--; else delete d.smoke; break;
    case 'tab': tab = el.dataset.t; if (tab === 'ilerleme') calMonth = new Date(today().getFullYear(), today().getMonth(), 1); window.scrollTo(0, 0); break;
    case 'calPrev': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); break;
    case 'calNext': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); break;
    case 'openDay': cur = pk(el.dataset.d); tab = 'bugun'; window.scrollTo(0, 0); break;
    case 'hintClose': s.hintClosed = true; break;
    case 'saveAdd': {
      const amt = num($('#saveAmt').value);
      if (!amt) { toast('Bir tutar yaz'); return; }
      S.savings.push({ id: Date.now(), date: dk(today()), amount: amt, note: $('#saveNote').value.trim() });
      toast(tl(amt) + ' eklendi'); break;
    }
    case 'saveDel': if (!confirm('Bu kaydı sileyim mi?')) return; S.savings = S.savings.filter(e => e.id !== +el.dataset.id); break;
    case 'export': exportData(); return;
    case 'import': $('#importFile').click(); return;
    case 'reset':
      if (!confirm('Tüm kayıtlar silinecek. Emin misin?') || !confirm('Geri alınamaz. Gerçekten sıfırlayayım mı?')) return;
      S = fresh(); S.settings.onboarded = true; cur = today(); toast('Sıfırlandı'); break;
    case 'obDone':
      s.name = $('#obName').value.trim();
      s.quitDate = $('#obQuit').value || null;
      s.cigsPerDay = Math.max(0, num($('#obCigs').value) || 0);
      s.packPrice = Math.max(0, num($('#obPrice').value) || 0);
      s.saveGoal = Math.max(0, num($('#obSave').value) || 0);
      s.onboarded = true; closeSheet(); break;
    case 'obSkip': s.onboarded = true; closeSheet(); break;
  }
  if (d.supp && !Object.keys(d.supp).length) delete d.supp;
  if (!d.water) delete d.water;
  if (S.days[k] && !Object.keys(S.days[k]).length) delete S.days[k];
  if (before < ROUTINES.length && doneCount(rec(k)) === ROUTINES.length) toast('Bugün hepsi tamam, harikasın 🌿');
  save(); render();
}

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.amt) {
    const k = dk(cur), d = S.days[k] || (S.days[k] = {}), v = num(t.value);
    if (v > 0) d[t.dataset.amt] = v; else delete d[t.dataset.amt];
    save(); return;
  }
  if (t.dataset.set) {
    const f = t.dataset.set; let v = t.value;
    if (f === 'supps') v = v.split('\n').map(x => x.trim()).filter(Boolean);
    else if (f === 'quitDate') v = v || null;
    else if (f === 'waterGoal') v = Math.min(30, Math.max(1, Math.round(num(v)) || 8));
    else if (f === 'packSize') v = Math.max(1, Math.round(num(v)) || 20);
    else if (f !== 'name') v = Math.max(0, num(v) || 0);
    else v = v.trim();
    S.settings[f] = v; save(); toast('Kaydedildi');
  }
});

function exportData() {
  const name = 'gungun-yedek-' + dk(today()) + '.json';
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Gün Gün yedeği' }).catch(() => {}); return; }
  } catch (e) {}
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const r = JSON.parse(await f.text());
    if (!r || !r.settings || !r.days) throw 0;
    if (!confirm('Bu yedek şu anki kayıtların yerine geçecek. Devam edeyim mi?')) return;
    localStorage.setItem(KEY, JSON.stringify(r)); S = load(); cur = today(); render(); toast('Yedek geri yüklendi');
  } catch (err) { toast('Bu dosya bir Gün Gün yedeği değil'); }
});

function render() {
  $('#view').innerHTML = tab === 'bugun' ? vToday() : tab === 'ilerleme' ? vProgress() : tab === 'birikim' ? vSave() : vSettings();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
}

// Uygulama gece yarısını açık geçirirse yeni güne geç.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = dk(today());
  if (t !== lastToday) { if (dk(cur) === lastToday) cur = today(); lastToday = t; render(); }
});

render();
if (!S.settings.onboarded) openOnboarding();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
