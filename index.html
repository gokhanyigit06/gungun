<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gün Gün">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Gün Gün</title>
<style>
:root{
  --bg:#FFF7EC;--card:#FFFFFF;--ink:#1F1B2E;--muted:#6E6880;--edge:#1F1B2E;--on:#1F1B2E;
  --pink:#FF8FAB;--pink-s:#FFE3EA;--sky:#5BC0F8;--sky-s:#DDF3FF;--lime:#8BD450;--lime-s:#EAF8DC;
  --violet:#A78BFA;--violet-s:#EEE8FF;--amber:#FFB547;--amber-s:#FFF0D6;--peach:#FF9F7A;--peach-s:#FFE8DE;
  --mint:#3DD6B0;--mint-s:#D9F7EF;--gold:#FFC93C;--gold-s:#FFF4C9;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17141F;--card:#231F2E;--ink:#F6F2FF;--muted:#A9A2BD;--edge:#000;
  --pink-s:#3B2531;--sky-s:#1D3140;--lime-s:#26351D;--violet-s:#2D2645;--amber-s:#3A2E1A;--peach-s:#3B2820;--mint-s:#1C3830;--gold-s:#39321B;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.35 "Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:520px;margin:0 auto;padding:10px 16px 24px}
small{color:var(--muted);font-size:13px;font-weight:500}
h2{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:14px 2px 14px}
h3{font-size:18px;font-weight:600;margin:24px 4px 10px}

.stk{border:2.5px solid var(--edge);border-radius:24px;box-shadow:3px 3px 0 var(--edge);background:var(--card)}
.card{padding:14px;margin-bottom:14px}
.btn3{border:2.5px solid var(--edge);border-radius:999px;box-shadow:2px 2px 0 var(--edge);background:var(--card);font-weight:600;padding:8px 14px;transition:transform .08s}
.btn3:active,.tap:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--edge)}

.top{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 2px 12px}
.hi{font-size:28px;font-weight:700;line-height:1.1}
.datenav{display:flex;align-items:center;gap:6px;color:var(--muted);margin-top:6px;font-size:15px}
.datenav button{width:30px;height:30px;border-radius:50%;border:2px solid var(--edge);background:var(--card);font-size:16px;line-height:1;padding:0;font-weight:700}
.datenav button:disabled{opacity:.25}
.back{border:0;background:none;color:var(--ink);font-weight:600;padding:0 2px 12px;text-decoration:underline;text-underline-offset:3px}

.hero{display:flex;align-items:center;gap:6px;padding:12px 14px 10px 6px;margin-bottom:16px;background:var(--lime-s)}
.hero.full{background:linear-gradient(135deg,var(--pink-s),var(--gold-s),var(--lime-s))}
.plant{width:124px;height:144px;flex:none}
.sway{transform-origin:60px 90px;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bubble{flex:1;min-width:0}
.score{font-size:46px;font-weight:700;line-height:1}
.score span{font-size:22px;color:var(--muted)}
.bubble p{margin:6px 0 10px;font-size:16px;line-height:1.3}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--edge);background:var(--card)}

.hint{background:var(--gold-s);padding:12px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.hint button{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0 2px}

.ch{display:flex;align-items:center;gap:10px}
.ch .t{flex:1;min-width:0;font-size:19px;font-weight:600}
.ch .t small{display:block;font-size:13px}
.emo{font-size:28px;line-height:1}

.supp{background:var(--pink-s)}
.caps{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cap{border:2.5px solid var(--edge);border-radius:999px;padding:7px 13px;font-size:15px;font-weight:600;
  background:linear-gradient(90deg,var(--card) 50%,var(--pink-s) 50%)}
.cap.on{background:linear-gradient(90deg,var(--pink) 50%,#FFC2D1 50%);color:var(--on)}
.cap.on::before{content:'✓ '}

.water{background:var(--sky-s);display:flex;gap:14px;align-items:center}
.glass{width:92px;height:122px;flex:none;cursor:pointer}
.wave path{animation:wave 2.2s linear infinite}
@keyframes wave{to{transform:translateX(50px)}}
.wbig{font-size:40px;font-weight:700;line-height:1}
.wbig span{font-size:20px;color:var(--muted)}
.wside{flex:1;min-width:0}
.wside p{margin:4px 0 10px;font-size:15px}
.pm{display:flex;gap:8px}
.pm button{width:46px;height:46px;font-size:24px;padding:0;line-height:1}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{position:relative;padding:14px 12px 12px;min-height:128px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;cursor:pointer}
.tile .emo{font-size:38px;margin-bottom:8px}
.tile b{font-size:18px;font-weight:600;line-height:1.15}
.tile small{margin-top:3px;line-height:1.25}
.tile .tick{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--edge);background:var(--card);display:grid;place-items:center;font-size:15px;font-weight:700}
.tile.on{color:var(--on)}
.tile.on small{color:rgba(31,27,46,.7)}
.tile.on .tick{background:var(--on);color:#fff}
.amt{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:14px;font-weight:600}
.amt input[type=number]{width:64px;padding:5px 8px;border-radius:10px;border:2px solid var(--edge);background:rgba(255,255,255,.75);color:var(--on);font:inherit;font-size:16px;text-align:center}

.smoke{background:var(--mint-s)}
.sbig{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
.sbig b{font-size:44px;font-weight:700;line-height:1}
.sbtns{display:flex;gap:8px;margin-top:12px;align-items:center}
.sbtns .ok{flex:1;padding:11px 8px;font-size:16px}
.sbtns .ok.on{background:var(--mint);color:var(--on)}
.cnt{display:flex;align-items:center;gap:2px;border:2.5px solid var(--edge);border-radius:999px;background:var(--card);padding:2px;flex:none}
.cnt button{width:36px;height:36px;border:0;background:none;font-size:22px;padding:0;font-weight:600}
.cnt span{min-width:58px;text-align:center;font-size:15px;font-weight:600}
.cnt.bad{background:var(--peach-s)}
.mile{margin-top:12px;padding:10px 12px;border-radius:16px;background:var(--card);border:2px dashed var(--edge);font-size:14px;line-height:1.3}
.mile b{font-weight:600}
.bar{height:12px;border-radius:99px;border:2px solid var(--edge);background:var(--card);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-right:2px solid var(--edge)}
.bar i[style*="width:0%"]{border:0}

.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.cf{position:fixed;width:9px;height:13px;border-radius:3px;pointer-events:none;z-index:50;border:1.5px solid var(--edge);
  animation:cf 1s cubic-bezier(.15,.6,.35,1) forwards}
@keyframes cf{60%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:1}100%{transform:translate(calc(var(--dx)*1.15),calc(var(--dy) + 140px)) rotate(calc(var(--r)*2));opacity:0}}

.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.ptile{padding:14px}
.ptile .big{font-size:30px;font-weight:700;line-height:1.1;margin:4px 0 2px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead b{font-size:19px;font-weight:600}
.calhead button{width:36px;height:36px;padding:0;font-size:18px}
.calhead button:disabled{opacity:.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cal button{aspect-ratio:1;border:2px solid var(--edge);border-radius:12px;background:var(--card);font-size:14px;font-weight:600;position:relative;overflow:hidden;padding:0}
.cal button::before{content:'';position:absolute;inset:0;background:var(--lime);opacity:var(--p)}
.cal button span{position:relative}
.cal button.full::before{opacity:1;background:var(--pink)}
.cal button.full span{font-size:17px}
.cal button.today{box-shadow:2px 2px 0 var(--edge)}
.cal button:disabled{border-style:dashed;opacity:.35}
.rstat{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px dashed rgba(110,104,128,.3)}
.rstat:first-child{border-top:0;padding-top:0}.rstat:last-child{padding-bottom:0}
.rstat .emo{font-size:26px;width:34px;text-align:center}
.rstat .g{flex:1;min-width:0}
.rstat .g b{font-weight:600}
.fire{font-weight:700;font-size:14px;padding:4px 9px;border-radius:999px;border:2px solid var(--edge);background:var(--amber);color:var(--on);white-space:nowrap}
.ms{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:2px dashed rgba(110,104,128,.3)}
.ms:first-child{border-top:0;padding-top:0}.ms:last-child{padding-bottom:0}
.ms .ico{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--edge);display:grid;place-items:center;flex:none;background:var(--card);font-size:17px}
.ms.done .ico{background:var(--mint)}
.ms .g{flex:1;min-width:0;font-size:15px;line-height:1.25}
.ms:not(.done) .g{color:var(--muted)}

.savehero{background:var(--gold-s);display:flex;gap:14px;align-items:center}
.jar{width:104px;height:130px;flex:none}
.savehero .big{font-size:38px;font-weight:700;line-height:1}
.addrow{display:flex;gap:8px;margin-bottom:10px}
.addrow input{flex:1;min-width:0}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed rgba(110,104,128,.3)}
.entry:first-child{border-top:0;padding-top:0}.entry:last-child{padding-bottom:0}
.entry .g{flex:1;min-width:0}
.entry b{font-size:18px;font-weight:600}
.x{border:0;background:none;color:var(--muted);font-size:22px;padding:2px 6px}

.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:14px;color:var(--muted);margin:0 2px 5px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;padding:12px;border-radius:14px;border:2.5px solid var(--edge);background:var(--card);color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:50px}
textarea{resize:vertical;min-height:160px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-btn{width:100%;padding:14px;font-size:17px;font-weight:700;background:var(--lime);color:var(--on);border-radius:16px}
.big-btn.pink{background:var(--pink)}.big-btn.gold{background:var(--gold)}.big-btn.sky{background:var(--sky)}
.big-btn.plain{background:var(--card);color:var(--ink)}.big-btn.warn{background:var(--peach-s);color:var(--ink)}
.ghost{width:100%;border:0;background:none;color:var(--muted);font-weight:600;padding:12px}
.btns{display:grid;gap:10px}
.note{margin-top:10px;font-size:14px;color:var(--muted);line-height:1.35}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:24px 0 4px}
.remrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px dashed rgba(110,104,128,.3)}
.remrow:first-child{border-top:0;padding-top:0}
.remrow label{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.remrow label span{display:block;font-size:15px}
.remrow small{display:block}
.remrow input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:#3E9A4A;margin:0}
.remrow input[type=time]{width:112px;flex:none;padding:8px 10px}
.remrow.off label span{color:var(--muted)}

nav#tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;display:flex;justify-content:center}
nav#tabs .in{display:flex;width:100%;max-width:496px;padding:6px;gap:4px;border:2.5px solid var(--edge);border-radius:26px;box-shadow:3px 3px 0 var(--edge);background:var(--card)}
nav#tabs button{flex:1;border:0;background:none;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:18px;color:var(--muted)}
nav#tabs button .e{font-size:22px;line-height:1.1;filter:grayscale(.6);opacity:.8}
nav#tabs button.on{background:var(--gold);color:var(--on)}
nav#tabs button.on .e{filter:none;opacity:1}

#sheet{position:fixed;inset:0;z-index:20;background:rgba(20,16,30,.45);display:none;align-items:flex-end}
#sheet.open{display:flex}
.sheetbox{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border:2.5px solid var(--edge);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.welcome{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.welcome .plant{width:96px;height:112px}
.welcome h2{margin:0 0 4px;font-size:26px}
.welcome p{margin:0;color:var(--muted);font-size:15px;line-height:1.3}

#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sway,.wave path,.pop,.cf{animation:none!important}}
</style>
</head>
<body>
<main id="view"></main>

<nav id="tabs"><div class="in">
  <button data-act="tab" data-t="bugun"><span class="e">🌱</span>Bugün</button>
  <button data-act="tab" data-t="ilerleme"><span class="e">🏆</span>İlerleme</button>
  <button data-act="tab" data-t="birikim"><span class="e">🐷</span>Birikim</button>
  <button data-act="tab" data-t="ayarlar"><span class="e">⚙️</span>Ayarlar</button>
</div></nav>

<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY = 'gungun_v1';
const DEF_SUPPS = ['Omega-3', 'B vitamini', 'C vitamini', 'Kolajen', 'Glukozamin', 'Magnezyum'];
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUNLER = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const EDGE = '#1F1B2E';

// Günlük rutinler; Filiz'in boyu ve takvim bunların kaçının tamamlandığına bakar.
const ROUTINES = [
  { k: 'supp',   t: 'Takviyeler',   ic: '💊', c: '#FF8FAB' },
  { k: 'water',  t: 'Su',           ic: '💧', c: '#5BC0F8' },
  { k: 'sport',  t: 'Spor',         ic: '🏃', c: '#8BD450', s: 'lime',   unit: 'sportMin',  u: 'dk',    hint: 'Kısa bir yürüyüş bile sayılır' },
  { k: 'book',   t: 'Kitap',        ic: '📖', c: '#A78BFA', s: 'violet', unit: 'bookPages', u: 'sayfa', hint: 'Birkaç sayfa yeter' },
  { k: 'vaka',   t: 'Vaka okuma',   ic: '🔎', c: '#FFB547', s: 'amber',  unit: 'vakaCount', u: 'vaka',  hint: 'Bugünün vakası' },
  { k: 'metime', t: 'Me time',      ic: '🛁', c: '#FF9F7A', s: 'peach',  unit: 'metimeMin', u: 'dk',    hint: 'Sadece sana ait bir an' },
  { k: 'smoke',  t: 'Dumansız gün', ic: '🚭', c: '#3DD6B0' },
];

// Sigarayı bıraktıktan sonra vücutta olanlar (Dünya Sağlık Örgütü'nün paylaştığı zaman çizelgesine göre).
const MILES = [
  { d: 1,   t: 'Kandaki karbonmonoksit seviyesi normale döner.' },
  { d: 2,   t: 'Tat ve koku alma duyusu toparlanmaya başlar.' },
  { d: 14,  t: 'Kan dolaşımı ve akciğer fonksiyonu iyileşmeye başlar.' },
  { d: 30,  t: 'Öksürük ve nefes darlığı azalmaya başlar.' },
  { d: 90,  t: 'Akciğerler belirgin biçimde daha rahat çalışır.' },
  { d: 365, t: 'Kalp hastalığı riski yarı yarıya azalır.' },
];

// Telefonun takvimine eklenen tekrarlı hatırlatmalar (sunucu gerekmez, bildirim takvimden gelir).
const DEF_REMS = [
  { id: 'supp',   t: '💊 Takviyelerini al',             time: '09:00', on: true,  freq: 'DAILY' },
  { id: 'water',  t: '💧 Bir bardak su iç',              time: '11:00', on: true,  freq: 'DAILY' },
  { id: 'water2', t: '💧 Su hedefine ne kadar kaldı?',  time: '16:00', on: true,  freq: 'DAILY' },
  { id: 'sport',  t: '🏃 Spor zamanı',                  time: '18:30', on: true,  freq: 'DAILY' },
  { id: 'metime', t: '🛁 Me time: biraz kendine ayır',  time: '20:30', on: false, freq: 'DAILY' },
  { id: 'read',   t: '📖 Kitap ve vaka okuma',          time: '21:30', on: true,  freq: 'DAILY' },
  { id: 'day',    t: '🌱 Filiz seni bekliyor, gününü işaretle', time: '22:30', on: true, freq: 'DAILY' },
  { id: 'save',   t: '🐷 Bu ayın birikimini ayır',      time: '10:00', on: true,  freq: 'MONTHLY' },
];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const dk = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pk = k => { const [a, b, c] = k.split('-').map(Number); return new Date(a, b - 1, c); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dayDiff = (a, b) => Math.round((b - a) / 864e5);
const tl = n => '₺' + Math.round(n).toLocaleString('tr-TR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };

function fresh() {
  return {
    settings: { name: '', supps: DEF_SUPPS.slice(), waterGoal: 8, saveGoal: 0, reminders: DEF_REMS.map(r => ({ ...r })),
      quitDate: null, cigsPerDay: 0, packPrice: 0, packSize: 20, onboarded: false, hintClosed: false },
    days: {}, savings: [],
  };
}
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && r.settings && r.days) { const f = fresh(); r.settings = Object.assign(f.settings, r.settings); r.savings = r.savings || []; return r; }
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Kaydedilemedi'); } }

let S = load();
let cur = today();
let lastToday = dk(cur);
let tab = 'bugun';
let calMonth = new Date(cur.getFullYear(), cur.getMonth(), 1);
let popKey = null;

const rec = k => S.days[k] || {};
function isDone(r, d) {
  const s = S.settings;
  switch (r) {
    case 'supp': return s.supps.length > 0 && s.supps.every(x => d.supp && d.supp[x]);
    case 'water': return (d.water || 0) >= s.waterGoal;
    case 'smoke': return d.smoke === 0;
    default: return !!d[r];
  }
}
const doneCount = d => ROUTINES.filter(r => isDone(r.k, d)).length;
function streak(r) {
  let d = today(), n = 0;
  if (!isDone(r, rec(dk(d)))) d = addDays(d, -1);
  while (isDone(r, rec(dk(d)))) { n++; d = addDays(d, -1); }
  return n;
}
function firstDay() { const ks = Object.keys(S.days).sort(); return ks.length ? pk(ks[0]) : today(); }

// Sigara: bırakılan günden bu yana içilmeyen adet ve cepte kalan para.
function smokeStats() {
  const s = S.settings;
  if (!s.quitDate) return null;
  const q = pk(s.quitDate), days = Math.max(0, dayDiff(q, today()));
  let smoked = 0;
  for (const [k, d] of Object.entries(S.days)) if (k >= s.quitDate && d.smoke > 0) smoked += d.smoke;
  const avoided = Math.max(0, days * (s.cigsPerDay || 0) - smoked);
  const money = s.packPrice > 0 ? avoided / (s.packSize || 20) * s.packPrice : 0;
  return { days, avoided, money };
}
const smokeDays = () => { const st = smokeStats(); return st ? st.days : streak('smoke'); };

function toast(msg) {

// Konfeti: dokunulan noktadan renkli kâğıtlar saçılır.
function burst(x, y, colors, n = 18) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'); p.className = 'cf';
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 110;
    p.style.cssText = `left:${x}px;top:${y}px;background:${colors[i % colors.length]};--dx:${Math.cos(a) * v}px;--dy:${Math.sin(a) * v - 60}px;--r:${Math.random() * 360 - 180}deg`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 1050);
  }
}

// Filiz: o gün tamamlanan rutin sayısına (0–7) göre büyüyen saksı fidanı.
function plant(n) {
  const top = [86, 74, 66, 58, 50, 44, 40, 36][n];
  const leaf = (y, side, sz) => { const cx = 60 + side * (sz + 1); return `<ellipse cx="${cx}" cy="${y}" rx="${sz}" ry="${sz * .52}" transform="rotate(${-side * 28} ${cx} ${y})" fill="#6CC04A" stroke="${EDGE}" stroke-width="2.5"/>`; };
  let g = '';
  if (n === 0) g = `<ellipse cx="60" cy="86" rx="8" ry="5" fill="#9A6B45" stroke="${EDGE}" stroke-width="2.5"/>`;
  else {
    g = `<path d="M60 90 Q${n > 3 ? 56 : 59} ${(90 + top) / 2} 60 ${top}" stroke="#3E9A4A" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
    if (n === 1) g += leaf(top + 2, -1, 6) + leaf(top + 2, 1, 6);
    if (n >= 2) g += leaf(80, 1, 11);
    if (n >= 3) g += leaf(74, -1, 11);
    if (n >= 4) g += leaf(64, 1, 9) + leaf(58, -1, 9);
    if (n === 2 || n === 3) g += leaf(top + 3, -1, 5) + leaf(top + 3, 1, 5);
    if (n === 5 || n === 6) g += `<ellipse cx="60" cy="${top - 5}" rx="${n === 6 ? 7 : 5.5}" ry="${n === 6 ? 9 : 7.5}" fill="#FF8FAB" stroke="${EDGE}" stroke-width="2.5"/>`;
    if (n === 7) {
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; g += `<circle cx="${60 + Math.cos(a) * 10}" cy="${top - 8 + Math.sin(a) * 10}" r="8" fill="#FF8FAB" stroke="${EDGE}" stroke-width="2.5"/>`; }
      g += `<circle cx="60" cy="${top - 8}" r="7" fill="#FFC93C" stroke="${EDGE}" stroke-width="2.5"/>`;
      g += `<path d="M18 30 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z M100 18 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#FFC93C" stroke="${EDGE}" stroke-width="1.5"/>`;
    }
  }
  const eyes = n === 0
    ? `<path d="M43 112 q4 4 8 0 M69 112 q4 4 8 0" stroke="${EDGE}" stroke-width="3" fill="none" stroke-linecap="round"/>`
    : `<circle cx="47" cy="111" r="3.6" fill="${EDGE}"/><circle cx="73" cy="111" r="3.6" fill="${EDGE}"/><circle cx="48.2" cy="109.8" r="1.2" fill="#fff"/><circle cx="74.2" cy="109.8" r="1.2" fill="#fff"/>`;
  const mouth = n === 7
    ? `<path d="M52 118 q8 9 16 0 z" fill="${EDGE}"/>`
    : n === 0 ? `<path d="M57 120 h6" stroke="${EDGE}" stroke-width="3" stroke-linecap="round"/>`
    : `<path d="M54 118 q6 5 12 0" stroke="${EDGE}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `<svg class="plant" viewBox="0 0 120 140" aria-hidden="true"><g class="sway">${g}</g>
    <path d="M30 96 L90 96 L83 131 Q82 136 77 136 L43 136 Q38 136 37 131 Z" fill="#F08A5D" stroke="${EDGE}" stroke-width="3" stroke-linejoin="round"/>
    <rect x="25" y="86" width="70" height="13" rx="6.5" fill="#F6A37F" stroke="${EDGE}" stroke-width="3"/>
    <circle cx="41" cy="119" r="4.5" fill="#FF8FAB" opacity=".75"/><circle cx="79" cy="119" r="4.5" fill="#FF8FAB" opacity=".75"/>${eyes}${mouth}</svg>`;
}
// Dolan kap (su bardağı ya da birikim kavanozu), içinde dalgalanan sıvıyla.
function vessel(kind, frac, color) {
  const shape = kind === 'jar'
    ? 'M30 26 H70 V34 Q88 42 88 62 V118 Q88 130 76 130 H24 Q12 130 12 118 V62 Q12 42 30 34 Z'
    : 'M14 12 H86 L78 122 Q77 128 71 128 H29 Q23 128 22 122 Z';
  const lo = kind === 'jar' ? 34 : 14, hi = kind === 'jar' ? 130 : 128;
  const y = lo + (1 - Math.max(0, Math.min(1, frac))) * (hi - lo);
  const id = 'v' + kind;
  return `<svg class="${kind === 'jar' ? 'jar' : 'glass'}" viewBox="0 0 100 ${kind === 'jar' ? 136 : 132}" ${kind === 'glass' ? 'data-act="w+" role="button" aria-label="Bir bardak ekle"' : 'aria-hidden="true"'}>
    <defs><clipPath id="${id}"><path d="${shape}"/></clipPath></defs>
    <g clip-path="url(#${id})"><rect width="100" height="140" fill="#fff"/>
      ${frac > 0 ? `<g transform="translate(0 ${y})"><g class="wave"><path d="M-100 5 Q-87.5 -2 -75 5 T-50 5 T-25 5 T0 5 T25 5 T50 5 T75 5 T100 5 T125 5 T150 5 V140 H-100Z" fill="${color}"/></g></g>` : ''}
    </g>
    <path d="${shape}" fill="none" stroke="${EDGE}" stroke-width="3.5" stroke-linejoin="round"/>
    ${kind === 'jar' ? `<rect x="26" y="14" width="48" height="13" rx="4" fill="#F08A5D" stroke="${EDGE}" stroke-width="3"/><text x="50" y="96" text-anchor="middle" font-size="26" font-weight="700" fill="${EDGE}" font-family="Fredoka,ui-rounded,sans-serif">₺</text>`

}

  return html;

      <input type="time" data-rem="${r.id}" value="${r.time}"></div>`).join('')}
    <div style="margin-top:14px"><button class="btn3 tap big-btn sky" data-act="ics">📅 Hatırlatmaları takvime ekle</button></div>
    <div class="note">Seçtiğin hatırlatmalar telefonunun takvimine her gün tekrarlanacak şekilde eklenir ve bildirim olarak gelir. Saatleri sonradan değiştirirsen takvimdeki eski “Gün Gün” etkinliklerini silip yeniden ekle.</div>
  </div>
  <h3>💾 Yedek</h3><div class="card stk"><div class="btns">
    <button class="btn3 tap big-btn plain" data-act="export">Yedeği kaydet</button>
    <button class="btn3 tap big-btn plain" data-act="import">Yedekten geri yükle</button>
    <button class="btn3 tap big-btn warn" data-act="reset">Her şeyi sıfırla</button></div>
    <div class="note">Tüm kayıtların yalnızca bu telefonda saklanır, hiçbir yere gönderilmez. Telefon değiştirirken yedeği kaydet, yeni telefonda geri yükle.</div>
  </div>
  <div class="foot">Gün Gün · sevgiyle yapıldı 🌱</div>`;
}

/* ---------- İlk açılış ---------- */
function openOnboarding() {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="sheetbox"><div class="welcome">${plant(2)}<div><h2>Merhaba, ben Filiz!</h2><p>Sen rutinlerini yaptıkça ben büyüyeceğim. Her şeyi yaptığın gün çiçek açarım 🌸</p></div></div>
    <label class="field"><span>Adın</span><input type="text" id="obName" placeholder="Seni nasıl selamlayayım?"></label>
    <label class="field"><span>Sigarayı bıraktığın ya da bırakacağın gün</span><input type="date" id="obQuit" value="${dk(today())}"></label>
    <div class="two"><label class="field"><span>Eskiden günde kaç adet</span><input type="number" inputmode="numeric" id="obCigs" placeholder="örn. 15"></label>
    <label class="field"><span>Paket fiyatı (₺)</span><input type="number" inputmode="decimal" id="obPrice" placeholder="örn. 100"></label></div>
    <label class="field"><span>Aylık birikim hedefi (₺)</span><input type="number" inputmode="decimal" id="obSave" placeholder="örn. 5000"></label>
    <div class="btns"><button class="btn3 tap big-btn" data-act="obDone">Hadi başlayalım 🌱</button><button class="ghost" data-act="obSkip">Şimdilik geç</button></div></div>`;
  sh.classList.add('open');
}
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet').innerHTML = ''; }

/* ---------- Etkileşim ---------- */
function act(a, el, ev) {
  const s = S.settings, k = dk(cur);
  const d = S.days[k] || (S.days[k] = {});
  const was = ROUTINES.map(r => isDone(r.k, d));
  const before = doneCount(d);
  popKey = null;
  switch (a) {
    case 'prev': cur = addDays(cur, -1); break;
    case 'next': if (k < dk(today())) cur = addDays(cur, 1); break;
    case 'gotoday': cur = today(); break;
    case 'supp': { const n = s.supps[+el.dataset.i]; d.supp = d.supp || {}; if (d.supp[n]) delete d.supp[n]; else d.supp[n] = true; buzz(); break; }
    case 'suppAll': { const all = s.supps.every(x => d.supp && d.supp[x]); d.supp = {}; if (!all) s.supps.forEach(x => d.supp[x] = true); buzz(); break; }
    case 'w+': d.water = (d.water || 0) + 1; buzz(); break;
    case 'w-': d.water = Math.max(0, (d.water || 0) - 1); break;
    case 'tog': { const r = el.dataset.k; if (d[r]) delete d[r]; else d[r] = true; buzz(); break; }
    case 'smoke0': if (d.smoke === 0) delete d.smoke; else d.smoke = 0; buzz(); break;
    case 's+': d.smoke = (d.smoke > 0 ? d.smoke : 0) + 1; break;
    case 's-': if (d.smoke > 1) d.smoke--; else delete d.smoke; break;
    case 'tab': tab = el.dataset.t; if (tab === 'ilerleme') calMonth = new Date(today().getFullYear(), today().getMonth(), 1); window.scrollTo(0, 0); break;
    case 'calPrev': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); break;
    case 'calNext': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); break;
    case 'openDay': cur = pk(el.dataset.d); tab = 'bugun'; window.scrollTo(0, 0); break;
    case 'hintClose': s.hintClosed = true; break;
    case 'saveAdd': {
      const amt = num($('#saveAmt').value);
      if (!amt) { toast('Bir tutar yaz'); return; }
      S.savings.push({ id: Date.now(), date: dk(today()), amount: amt, note: $('#saveNote').value.trim() });
      if (amt > 0 && ev) burst(ev.clientX, ev.clientY, ['#FFC93C', '#F08A5D', '#FFE38A'], 22);
      toast(tl(amt) + ' kumbarada 🪙'); break;
    }
    case 'saveDel': if (!confirm('Bu kaydı sileyim mi?')) return; S.savings = S.savings.filter(e => e.id !== +el.dataset.id); break;
    case 'export': exportData(); return;
    case 'ics': addToCalendar(); return;
    case 'import': $('#importFile').click(); return;
    case 'reset':
      if (!confirm('Tüm kayıtlar silinecek. Emin misin?') || !confirm('Geri alınamaz. Gerçekten sıfırlayayım mı?')) return;
      S = fresh(); S.settings.onboarded = true; cur = today(); toast('Sıfırlandı'); break;
    case 'obDone':
      s.name = $('#obName').value.trim();
      s.quitDate = $('#obQuit').value || null;
      s.cigsPerDay = Math.max(0, num($('#obCigs').value) || 0);
      s.packPrice = Math.max(0, num($('#obPrice').value) || 0);
      s.saveGoal = Math.max(0, num($('#obSave').value) || 0);
      s.onboarded = true; closeSheet(); break;
    case 'obSkip': s.onboarded = true; closeSheet(); break;
  }
  if (d.supp && !Object.keys(d.supp).length) delete d.supp;
  if (!d.water) delete d.water;
  // Yeni tamamlanan rutin varsa o kartı zıplat ve konfeti saç.
  const now = ROUTINES.map(r => isDone(r.k, d));
  const fresh1 = ROUTINES.find((r, i) => now[i] && !was[i]);
  if (fresh1) { popKey = fresh1.k; if (ev) burst(ev.clientX, ev.clientY, [fresh1.c, '#FFC93C', '#fff']); }
  if (S.days[k] && !Object.keys(S.days[k]).length) delete S.days[k];
  if (before < ROUTINES.length && doneCount(rec(k)) === ROUTINES.length) {
    popKey = 'hero';
    setTimeout(() => { burst(innerWidth / 2, 160, ROUTINES.map(r => r.c), 46); toast('Filiz çiçek açtı! 🌸'); }, 120);
  }
  save(); render(); popKey = null;
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return;
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) act(b.dataset.act, b, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.amt) {
    const k = dk(cur), d = S.days[k] || (S.days[k] = {}), v = num(t.value);
    if (v > 0) d[t.dataset.amt] = v; else delete d[t.dataset.amt];
    save(); return;
  }
  if (t.dataset.rem || t.dataset.remon) {
    const r = S.settings.reminders.find(x => x.id === (t.dataset.rem || t.dataset.remon));
    if (!r) return;
    if (t.dataset.remon) { r.on = t.checked; t.closest('.remrow').classList.toggle('off', !r.on); }
    else if (/^\d{2}:\d{2}$/.test(t.value)) r.time = t.value;
    save(); return;
  }
  if (t.dataset.set) {
    const f = t.dataset.set; let v = t.value;
    if (f === 'supps') v = v.split('\n').map(x => x.trim()).filter(Boolean);
    else if (f === 'quitDate') v = v || null;
    else if (f === 'waterGoal') v = Math.min(30, Math.max(1, Math.round(num(v)) || 8));
    else if (f === 'packSize') v = Math.max(1, Math.round(num(v)) || 20);
    else if (f !== 'name') v = Math.max(0, num(v) || 0);
    else v = v.trim();
    S.settings[f] = v; save(); toast('Kaydedildi ✓');
  }
});

function exportData() {
  const name = 'gungun-yedek-' + dk(today()) + '.json';
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Gün Gün yedeği' }).catch(() => {}); return; }
  } catch (e) {}
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

// Seçili hatırlatmalardan tekrarlı etkinlikler içeren bir .ics takvim dosyası üretir.
function icsText(rems) {
  const ie = x => x.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const url = location.href.split('#')[0].split('?')[0];
  const ts = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Gun Gun//TR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Gün Gün'];
  const t = today();
  for (const r of rems) {
    const [hh, mm] = r.time.split(':').map(Number);
    const start = r.freq === 'MONTHLY' ? new Date(t.getFullYear(), t.getMonth(), 1, hh, mm) : new Date(t.getFullYear(), t.getMonth(), t.getDate(), hh, mm);
    const end = new Date(start.getTime() + 10 * 60000);
    L.push('BEGIN:VEVENT', 'UID:gungun-' + r.id + '@gungun', 'DTSTAMP:' + stamp, 'DTSTART:' + ts(start), 'DTEND:' + ts(end),
      'RRULE:' + (r.freq === 'MONTHLY' ? 'FREQ=MONTHLY;BYMONTHDAY=1' : 'FREQ=DAILY'),
      'SUMMARY:' + ie(r.t), 'DESCRIPTION:' + ie('Gün Gün: ' + url), 'URL:' + url, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + ie(r.t), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}
function addToCalendar() {
  const rems = S.settings.reminders.filter(r => r.on);
  if (!rems.length) { toast('En az bir hatırlatma seç'); return; }
  const blob = new Blob([icsText(rems)], { type: 'text/calendar;charset=utf-8' });
  const u = URL.createObjectURL(blob);
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) { location.href = u; return; }
  const a = document.createElement('a'); a.href = u; a.download = 'gungun-hatirlatmalar.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000);
  toast('Dosyayı açıp takvimine ekle');
}

$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const r = JSON.parse(await f.text());
    if (!r || !r.settings || !r.days) throw 0;
    if (!confirm('Bu yedek şu anki kayıtların yerine geçecek. Devam edeyim mi?')) return;
    localStorage.setItem(KEY, JSON.stringify(r)); S = load(); cur = today(); render(); toast('Yedek geri yüklendi');
  } catch (err) { toast('Bu dosya bir Gün Gün yedeği değil'); }
});

function render() {
  $('#view').innerHTML = tab === 'bugun' ? vToday() : tab === 'ilerleme' ? vProgress() : tab === 'birikim' ? vSave() : vSettings();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
}

// Uygulama gece yarısını açık geçirirse yeni güne geç.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = dk(today());
  if (t !== lastToday) { if (dk(cur) === lastToday) cur = today(); lastToday = t; render(); }
});

render();
if (!S.settings.onboarded) openOnboarding();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
